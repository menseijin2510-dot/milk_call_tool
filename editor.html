<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M!LK Call</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #fffafa;
  font-family: sans-serif;
  color: #333;
}

main {
  max-width: 800px;
  margin: auto;
}

h1 {
  text-align: center;
}

select {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  background: white;
}

.player {
  margin-top: 15px;
  width: 100%;
  aspect-ratio: 16 / 9;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 12px;
}

.message {
  text-align: center;
  color: #888;
  margin-top: 15px;
}
</style>
</head>

<body>

<main>

<h1>🥛 M!LK Call</h1>

<select id="songSelect"></select>

<div class="player">
  <iframe
    id="youtube"
    src=""
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</div>

<div class="message">
  曲を選んでね！
</div>

</main>

<script>

const songs = [
  ["コーヒーが飲めません", "S0Mnp6D8fsw"],
  ["反抗期アバンチュール", "54F33VezY64"],
  ["新学期アラカルト", "ZaUknVdp9b0"],
  ["夏味ランデブー", "baM2h4gA25I"],
  ["疾走ペンデュラム", "FszLsJaFUt8"],
  ["Milky Snow", "GquPDyruk28"],
  ["テルネロファイター", "_HbcPp888mM"],
  ["サンキュー！N・D・K！", "XPMbFgs88hY"],
  ["めちゃモル", "WEPZ---ZMnI"],
  ["Brave Saga", "6e5aLbCwtB0"],
  ["My Treasure", "DgX9cX3FCjw"],
  ["SAY YEAH", "k9a1Ou7sl-c"],
  ["DEAR LIFE", "eSS-248rywA"],
  ["シアワシェイク", "9SLYEDt_HfI"],
  ["フレ！フレ！オレ！", "3zsD0tQMS78"],
  ["エビバディグッジョブ！", "A3H3Ldc25Ts"],
  ["ブンブンブン", "69H3LETHcoc"],
  ["LUCKY CALL", "dVMDWxIAAy8"],
  ["好きすぎて滅！", "14cxcH1eiPc"],
  ["爆裂愛してる", "20bYUQZOAeQ"],
  ["アイドルパワー", "d1d9cz3LcJ4"],
  ["You!Joy!Parade!", "lx3KDeBoLMM"],
  ["時空超えてユニバース", "bQBiZ5N-juo"]
];

const select = document.getElementById("songSelect");
const youtube = document.getElementById("youtube");

songs.forEach(function(song, index) {

  const option = document.createElement("option");

  option.value = index;
  option.textContent = song[0];

  select.appendChild(option);

});

function changeSong() {

  const song = songs[select.value];

  youtube.src =
    "https://www.youtube.com/embed/" +
    song[1] +
    "?playsinline=1&rel=0";

}

changeSong();

select.addEventListener(
  "change",
  changeSong
);

</script>

</body>
</html>
